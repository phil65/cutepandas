[project]
name = "cutepandas"
version = "0.5.0"
description = "Qt item models, delegates and widgets for dataframes (pandas, polars, pyarrow)"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "phil65", email = "philipptemminghoff@googlemail.com" }]
keywords = [
  "dataframe",
  "gui",
  "model-view",
  "multiindex",
  "pandas",
  "polars",
  "pyarrow",
  "pyqt6",
  "pyside6",
  "qt",
  "table",
  "widgets",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: User Interfaces",
  "Typing :: Typed",
]
dependencies = ["numpy>=2.5.5", "pandas>=3.1.1", "prettyqt>=1.61.4", "pyarrow>=26.0.1"]

[project.urls]
Documentation = "https://phil65.github.io/cutepandas/"
Homepage = "https://github.com/phil65/cutepandas"
Issues = "https://github.com/phil65/cutepandas/issues"
Source = "https://github.com/phil65/cutepandas"

[project.optional-dependencies]
addons = ["docutils>=0.23", "orjson>=3.13.0"]
polars = ["polars>=2.1.0"]
pyqt6 = ["pyqt6>=6.12.1", "PyQt6-Charts", "PyQt6-WebEngine", "PyQt6-QScintilla"]
pyside6 = ["pyside6>=6.12.0"]

[dependency-groups]
dev = [
  "commitizen>=4.19.4",
  "deptry>=0.25.1",
  "devtools",
  "pytest>=9.2.0",
  "pytest-cov",
  "pytest-qt>=4.5.0",
  "types-Deprecated",
  "types-docutils",
  "types-orjson",
]
docs = [
  # mknodes >= 4 includes the site generator (formerly mkdocs-mknodes)
  "mknodes>=4.0.0",
  # Zensical renders the API pages' `:::` blocks through mkdocstrings
  # (mknodes >= 3 no longer pulls it in).
  "mkdocstrings[python]>=1.0",
]
lint = [
  # Pinned on purpose: CI, pre-commit and editors all run exactly these versions.
  "ruff==0.17.6",
  "ty==0.0.108",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.4.1"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_start_rev = "v0.1.0"
changelog_file = "docs/changelog.md"
version_files = ["pyproject.toml:version"]

[tool.deptry]
extend_exclude = ["docs"]

[tool.deptry.per_rule_ignores]
# Qt bindings are selectable extras used by prettyqt; addons are optional prettyqt features.
DEP002 = [
  "docutils",
  "orjson",
  "pyqt6",
  "PyQt6-Charts",
  "PyQt6-WebEngine",
  "PyQt6-QScintilla",
  "pyside6",
]

[tool.pytest]
junit_family = "xunit2"
log_cli = true
log_date_format = "%Y-%m-%d %H:%M:%S"
log_format = "%(asctime)s %(levelname)s %(message)s"
minversion = "9.0"
testpaths = ["tests/"]
qt_qapp_name = "cutepandas-test"
qt_log_level_fail = "CRITICAL"

[tool.ruff]
line-length = 90
extend-exclude = ["docs", "__init__.py", "prettyqt/qt/"]
target-version = "py314"

[tool.ruff.lint]
select = [
  # "A",    # Flake8-builtins
  # "ANN",  # Flake8-Annotations
  # "ASYNC",  # Flake8-Async
  # "ARG",  # # Flake8-Unused-Arguments
  "B",  # flake8-bugbear
  # "BLE",  # Flake8-blind-except
  "C",
  "C4",  # flake8-comprehensions
  # "C90",  # MCCabe
  # "COM",  #  Flake8-commas
  # "CPY", #  Copyright-related rules
  "D",  # PyDocStyle
  # "DTZ",  # Flake8- Datetimez
  "E",  # PyCodeStyle Error
  # "EM",   # flake8-errmsg
  # "ERA",  #  Eradicate
  "EXE",  # flake8-executable
  "F",  # PyFlakes
  "FA",  # flake8-future-annotations
  # "FBT",  # flake8-boolean-trap
  # "FIX",  # flake8-fixme
  "FLY",  # flynt
  # "G",    #  flake8-logging-format
  "I",  # ISort
  "ICN",  # Flake8-import-conventions
  "INP",  # flake8-no-pep420
  "INT",  # flake8-gettext
  "ISC",  # flake8-implicit-str-concat
  # "N",    # pep8-naming
  # "NPY",  # numpy-specific rules
  # "PD",   # pandas-vet
  "PERF",  # perflint
  # "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PLE",  # PyLint Error
  "PLC",  # PyLint convention
  # "PLW",  # PyLint Warning
  # "PLR",  # PyLint refactor
  # "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  # "Q",    # flake8-quotes
  # "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff-specific rules
  # "S",    # flake8-bandit
  # "SIM",  # flake8-simplify
  "SLF",  # flake8-self
  "SLOT",  # flake8-slots
  # "T",
  # "TD",   # flake8-todos
  "T10",  # flake8-debugger
  # "T20",  # flake8-print
  # "TCH",  # flake8-type-checking
  "TID",  # flake8-tidy-imports
  # "TRY",  # tryceratops
  "UP",  # PyUpgrade
  "W",  # PyCodeStyle warning
  "YTT",  # flake8-2020
]
ignore = [
  "C408",  # Unnecessary {obj_type} call (rewrite as a literal)
  "B905",  # zip() without an explicit strict= parameter
  "C901",  # {name} is too complex ({complexity} > {max_complexity})
  "D100",  # Missing docstring in public module
  "D101",  # Missing docstring in public class
  "D102",  # Missing docstring in public method
  "D103",  # Missing docstring in public function
  "D104",  # Missing docstring in public package
  "D105",  # Missing docstring in magic method
  "D106",  # Missing docstring in public nested class
  "D107",  # Missing docstring in __init__
  "D203",  # 1 blank line required before class docstring
  "D204",  # 1 blank line required after class docstring
  "D213",  # Multi-line docstring summary should start at the second line
  "D215",  # Section underline is over-indented ("{name}")
  "D400",  # First line should end with a period
  "D401",  # First line of docstring should be in imperative mood: "{first_line}"
  "D404",  # First word of the docstring should not be "This"
  "D406",  # Section name should end with a newline ("{name}")
  "D407",  # Missing dashed underline after section ("{name}")
  "D408",  # Section underline should be in the line following the section's name ("{name}")
  "D409",  # Section underline should match the length of its name ("{name}")
  "D413",  # Missing blank line after last section ("{name}")
  "SLF001",  # Private member accessed
  "RUF012",  # Mutable class attributes should be annotated
  "RUF013",  # PEP 484 prohibits implicit `Optional`
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.isort]
lines-after-imports = 2
# lines-between-types = 1
# atomic = true
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.format]
# Enable preview style formatting.
preview = true
docstring-code-format = true

[tool.ty.environment]
python-version = "3.14"
python-platform = "all"

[tool.ty.src]
include = ["cutepandas"]

[tool.ty.rules]
incompatible-mutable-override = "ignore"

[tool.uv]
default-groups = ["dev", "lint", "docs"]

[tool.uv.build-backend]
module-root = ""
